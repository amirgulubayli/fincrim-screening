# Dev environment only. The scored system (system/) uses the Python standard library
# and must never depend on anything listed here (tests/test_stdlib_only.py enforces this).
[project]
name = "fincrim-screening"
version = "0.1.0"
description = "Deterministic, explainable screening-hit adjudication with human-in-the-loop triage"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "openpyxl>=3.1"]
app = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]

[tool.uv]
package = false
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["system"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["system", "tools", "app/server"]
# verbatim copy of the reviewed contrib engine; keep it byte-identical to contrib/
extend-exclude = ["system/screening/core/aml_engine.py", "contrib"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
