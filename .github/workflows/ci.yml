name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (stdlib, tests, determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uv run ruff check system tests tools
      - name: Unit tests (includes stdlib-only guard for system/)
        run: uv run pytest -q
      - name: system/run works with a bare python3 (no deps installed)
        run: |
          chmod +x system/run
          system/run tests/fixtures/mini /tmp/out.jsonl
          python3 -c "import json;[json.loads(l) for l in open('/tmp/out.jsonl')];print('ok')"
      - name: Reproducibility (5 fresh processes, different hash seeds)
        run: python3 system/screen.py repro --data tests/fixtures/mini --runs 5 --out-dir /tmp/repro
      - name: No data or secrets committed
        run: |
          if git ls-files | grep -E '^data/(dev|unseen)/|\.xlsx$|^\.env$|practice_labels\.jsonl$' | grep -v '^tests/'; then
            echo "::error::data files are tracked - the brief forbids committing dev/ data"; exit 1; fi

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('app/web/package-lock.json') != '' }}
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build
